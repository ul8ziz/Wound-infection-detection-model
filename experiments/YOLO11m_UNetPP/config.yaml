# =============================================================================
# YOLO11m + U-Net++ Wound Detection & Segmentation — Configuration
# =============================================================================

# === General ===
seed: 42
# Main data root: val/test images + labels (unchanged splits)
data_root: "data/wound_focus_clean"
# Offline-augmented training set (~4× images). Labels + images under this folder.
data_root_train: "data/wound_focus_clean/augmented"
ann_train: "data/wound_focus_clean/augmented/train_augmented.json"
ann_val: "data/wound_focus_clean/val_wound_only.json"
ann_test: "data/wound_focus_clean/test_wound_only.json"
num_workers: 0   # Windows-safe default; increase on Linux
# Class list for YOLO training.  Options:
#   ["wound"]            — wound-only mode (default, single-class)
#   ["wound", "marker"]  — wound + 3x3 cm marker (enables dynamic calibration)
classes: ["wound"]

# === YOLO11m-seg (Stage 1: Detection + Coarse Segmentation) ===
yolo:
  model: "yolo11m-seg.pt"
  image_size: 1024
  batch_size: 4
  epochs: 100
  lr0: 0.01
  lrf: 0.01
  optimizer: "SGD"
  momentum: 0.937
  weight_decay: 0.0005
  patience: 20
  # Augmentation (marker-safe: no perspective distortion)
  degrees: 10
  perspective: 0.0
  flipud: 0.5
  fliplr: 0.5
  mosaic: 0.5
  mixup: 0.0
  close_mosaic: 15
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4

# === U-Net++ (Stage 2: Refined Segmentation on ROI crops) ===
# Default below is a "fast training" preset (shorter wall-clock). For maximum ROI
# detail, use e.g. input_size [384, 384], encoder efficientnet-b3, epochs 50,
# scheduler_T_max 50, early_stop_patience 10 (see README / DOCUMENTATION).
unet:
  encoder: "efficientnet-b1"
  encoder_weights: "imagenet"
  input_size: [256, 256]
  in_channels: 3
  classes: 1
  batch_size: 16
  epochs: 35
  lr: 0.0001
  weight_decay: 0.0001
  optimizer: "AdamW"
  scheduler: "CosineAnnealingLR"
  scheduler_T_max: 35
  scheduler_eta_min: 0.000001
  early_stop_patience: 6
  loss_type: "focal_dice"
  loss_bce_weight: 0.5
  loss_dice_weight: 0.5
  focal_alpha: 0.25
  focal_gamma: 2.0
  roi_padding: 0.1   # training ROI expansion only (GT bbox in COCO JSON)

# === Combined Inference (YOLO + U-Net++ on full images) ===
# ``combined.roi_padding`` is independent: expands YOLO boxes at inference only.
# Tuned defaults (val, partial grid — see results/combined/tuning/best_config_val.json; re-run scripts/tune_combined.py for full search):
combined:
  yolo_conf_thresh: 0.2
  yolo_min_conf_inference: 0.001   # Ultralytics conf= (low); filter with yolo_conf_thresh in Python)
  unet_mask_thresh: 0.3
  roi_padding: 0.0
  mask_upscale: "linear_probs"     # linear_probs | nearest_binary
  bbox_selection_strategy: "highest_conf"   # highest_conf | largest_area | merge_overlapping
  merge_iou_thresh: 0.5
  coco_bbox_mode: "yolo_xyxy"      # yolo_xyxy | mask_tight | padded_roi (legacy eval)
  min_mask_area: 0
  postprocess_preset: "none"       # none | remove_small_cc | binary_closing | open_close | fill_holes | close_fill
  postprocess: []                  # optional ordered ops; see combined/postprocess.py
  enable_tta: true
  debug_save_intermediates: false
  debug_output_dir: "results/combined/debug"
  debug_max_images: 16
  balanced_score_weights:
    bbox_AP50: 0.35
    segm_AP50: 0.35
    bbox_AP75: 0.15
    segm_AP75: 0.15
  pixels_per_cm: 26.0
  marker_real_cm: 3.0
  num_qualitative_samples: 8

# =============================================================================
# YOLO11m + U-Net++ Wound Detection & Segmentation — Configuration
# =============================================================================

# === General ===
seed: 42
# Legacy experiment slug kept for continuity with Phase 7 result folders/checkpoints.
# The active config below is a post-Phase7 tuned variant, not an exact copy of the
# benchmark recipe documented in reports/final_improvement_report.md.
experiment_name: "best_phase7_finetune_roi20"
# Main data root: val/test images + labels (unchanged splits)
data_root: "data/wound_focus_clean"
# Offline-augmented training set (~4× images). Labels + images under this folder.
data_root_train: "data/wound_focus_clean/augmented_marker"
ann_train: "data/wound_focus_clean/augmented_marker/train_augmented.json"
ann_val: "data/wound_focus_clean/val_wound_only.json"
ann_test: "data/wound_focus_clean/test_wound_only.json"
num_workers: 2   # Windows-safe default; increase on Linux
# Class list for YOLO training.  Options:
#   ["wound"]            — wound-only mode (default, single-class)
#   ["wound", "marker"]  — wound + 3x3 cm marker (enables dynamic calibration)
classes: ["wound", "marker"]

# === YOLO11m-seg (Stage 1: Detection + Coarse Segmentation) ===
yolo:
  model: "yolo11m-seg.pt"
  image_size: 768                   # Active post-Phase7 setting; historical Phase 7 benchmark used 1024
  batch_size: 2
  epochs: 50
  lr0: 0.005                       # halved (was 0.01) — reduce early cls_loss spike
  lrf: 0.01
  optimizer: "SGD"
  momentum: 0.937
  weight_decay: 0.001              # doubled (was 0.0005) — resist overfitting
  patience: 12                     # stop earlier if overfitting (was 20)
  degrees: 7
  perspective: 0.0
  flipud: 0.3
  fliplr: 0.5
  mosaic: 0.5                     # more diversity (was 0.3)
  mixup: 0.0
  close_mosaic: 15
  hsv_h: 0.01
  hsv_s: 0.5
  hsv_v: 0.4                      # more brightness variety (was 0.3)
  # --- Regularization (new) ---
  dropout: 0.1                    # head dropout — effective against overfitting
  label_smoothing: 0.1            # soften cls targets — reduce cls_loss gap
  cos_lr: true                    # cosine LR schedule — smoother convergence
  warmup_epochs: 5                # stable start before full LR

# === U-Net++ (Stage 2: Refined Segmentation on ROI crops) ===
# Default below is a "fast training" preset (shorter wall-clock). For maximum ROI
# detail, use e.g. input_size [384, 384], encoder efficientnet-b3, epochs 50,
# scheduler_T_max 50, early_stop_patience 10 (see README / DOCUMENTATION).
unet:
  architecture: "unetplusplus"   # unetplusplus | deeplabv3plus
  encoder: "efficientnet-b1"
  encoder_weights: "imagenet"
  input_size: [512, 512]
  in_channels: 3
  classes: 1
  batch_size: 4                    # halved for 512x512 GPU memory
  epochs: 60
  lr: 0.00003                     # fine-tune from best checkpoint (was 0.0001 from scratch)
  weight_decay: 0.0005            # stronger regularization (was 0.0001) — resist mild overfitting
  optimizer: "AdamW"
  scheduler: "CosineAnnealingLR"
  scheduler_T_max: 55             # aligned to fine-tune epochs
  scheduler_eta_min: 0.000001
  early_stop_patience: 10         # stop early if no improvement (was 15) — fine-tune converges faster
  loss_type: "focal_dice_boundary"
  loss_bce_weight: 0.4
  loss_dice_weight: 0.6
  loss_boundary_weight: 0.35     # Active post-Phase7 value; historical Phase 7 benchmark used 0.20
  boundary_kernel_size: 3         # finer edge detection (was 5) — sub-pixel boundary detail
  focal_alpha: 0.25
  focal_gamma: 2.0
  roi_padding: 0.20
  roi_crop_mode: "mixed"          # gt_only | mixed | yolo_predicted
  eval_roi_crop_mode: "yolo_predicted"  # realistic YOLO-driven validation (matches inference)
  roi_mix_weights:
    gt: 0.45
    jitter: 0.30
    yolo_cached: 0.25
  roi_jitter:
    scale_min: 0.85
    scale_max: 1.15
    shift_frac: 0.10
  yolo_roi_cache_path: "experiments/YOLO11m_UNetPP/results/roi_cache/train_yolo_rois.json"
  eval_yolo_roi_cache_path: "experiments/YOLO11m_UNetPP/results/roi_cache/val_yolo_rois.json"
  test_yolo_roi_cache_path: "experiments/YOLO11m_UNetPP/results/roi_cache/test_yolo_rois.json"
  yolo_match_iou_min: 0.05
  resume_checkpoint: "experiments/YOLO11m_UNetPP/checkpoints/unet/best_phase7_finetune_roi20/best_model.pth"  # fine-tune from best Phase7
  freeze_encoder: false
  # Batch-size guidance for resolution sweeps (adjust for your GPU):
  #   256 -> 16, 384 -> 8, 512 -> 4
  
# === Combined Inference (YOLO + U-Net++ on full images) ===
# ``combined.roi_padding`` is independent: expands YOLO boxes at inference only.
# Active defaults combine the earlier tuning sweep with later post-Phase7 tweaks.
# They are not a byte-for-byte copy of the historical Phase 7 benchmark recipe.
# See results/combined/tuning/best_config_val.json and reports/final_improvement_report.md.
combined:
  yolo_conf_thresh: 0.15           # Active post-Phase7 value; historical Phase 7 benchmark used 0.25
  yolo_min_conf_inference: 0.001   # Ultralytics conf= (low); filter with yolo_conf_thresh in Python)
  unet_mask_thresh: 0.40           # tuned (was 0.25) — tune_combined.py Stage C best
  roi_padding: 0.20                # matched to training roi_padding
  mask_upscale: "nearest_binary"   # sharper edges (was linear_probs) — improves segm_AP75
  bbox_selection_strategy: "merge_overlapping"  # merge duplicate detections (was all_above_thresh)
  merge_iou_thresh: 0.3            # more aggressive merging (was 0.5) — fixes duplicate wound boxes
  coco_bbox_mode: "yolo_xyxy"      # tuned — stable across stages
  min_mask_area: 0                 # tuned (was 100) — tune_combined.py Stage B best
  postprocess_preset: "largest_then_fill"  # tuned (was none) — tune_combined.py Stage B best
  postprocess: []                  # optional ordered ops; see combined/postprocess.py
  refinement_postprocess: "boundary_refine"  # sharpen mask edges (was none)
  enable_tta: false                # Active post-Phase7 value; historical Phase 7 benchmark enabled TTA
  multi_scale_refinement: false    # Active post-Phase7 value; historical Phase 7 benchmark enabled this
  multi_scale_roi_paddings: [0.10, 0.20, 0.30]
  multi_scale_fusion: "mean"      # mean | weighted_mean | stability_select
  multi_scale_weights: []         # optional weights aligned to multi_scale_roi_paddings
  score_fusion_yolo_weight: 0.7   # final_score = w*yolo_conf + (1-w)*mask_confidence
  debug_save_intermediates: false
  debug_output_dir: "results/combined/debug"
  debug_max_images: 16
  balanced_score_weights:
    bbox_AP50: 0.25
    segm_AP50: 0.20
    combined_AP50: 0.20
    bbox_AP75: 0.15
    segm_AP75: 0.15
    mean_dice: 0.05
  # pixels_per_cm removed: when marker is not detected, cm² is not computed
  # (area is reported in pixels only with measurement_quality="unavailable")
  marker_class_id: 1              # YOLO class index for the 3x3 cm marker
  marker_real_cm: 3.0
  num_qualitative_samples: 8
